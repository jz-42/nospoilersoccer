name: Update World Cup data

on:
  workflow_dispatch: {}

# One loop at a time; Cloudflare only dispatches a new run when none is active.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Poll every 5 minutes for ~53 minutes. Each cycle pulls results + odds;
      # the broad YouTube recovery scan runs only on cycle 1 because the Worker
      # handles new uploads through WebSub plus quota-free one-minute feeds.
      # Cloudflare decides when to start each run and checks every minute.
      - name: Update loop (every 5 min)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CURATOR_ERROR_FLAG: /tmp/curator-error
          RESULTS_AUDIT_FILE: /tmp/results-audit.md
          RESULTS_BACKUP_FILE: /tmp/wc2026-before-results.ts
          LIVE_STATUS_AUDIT_FILE: /tmp/live-status-audit.md
          LIVE_STATUS_BACKUP_FILE: /tmp/wc2026-before-live-status.ts
          ODDS_BACKUP_FILE: /tmp/wc2026-before-odds.ts
          BACKFILL_BACKUP_FILE: /tmp/wc2026-before-odds-backfill.ts
          VIDEOS_BACKUP_DIR: /tmp/wc2026-videos-backup
          CLUB_AUDIT_FILE: /tmp/club-audit.md
          CLUB_BACKUP_ROOT: /tmp/club-backup
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"

          # Club competitions, in the order they are updated each cycle:
          #   <season id> <competition id> <ESPN league slug>
          CLUB_COMPETITIONS="eng1-2026:eng1:eng.1 esp1-2026:esp1:esp.1 ucl-2026:ucl:uefa.champions"
          mkdir -p src/data/club

          # Stage only paths that exist. The club data and hot-state files are
          # generated, so on a fresh season they are legitimately absent and
          # `git add` on a missing pathspec is a fatal error under `set -e`.
          add_if_present() {
            for path in "$@"; do
              if [ -e "$path" ]; then git add "$path"; fi
            done
            return 0
          }

          # Put one season's files back exactly as they were before a failed step.
          # Deletes first so a file the failed step *created* does not survive.
          club_restore() {
            season="$1"; backup_dir="$2"
            find src/data/club -maxdepth 1 -name "${season}*" -delete 2>/dev/null || true
            if [ -n "$(ls -A "$backup_dir" 2>/dev/null)" ]; then
              cp "$backup_dir"/* src/data/club/
            fi
            return 0
          }

          # Backup / run / validate / revert for one club step — the same
          # discipline as each World Cup step above, scoped to a single season so
          # one competition failing cannot discard another's work in the same
          # cycle. This is why bad data never reaches main; keep it per step.
          club_step() {
            label="$1"; season="$2"; backup_dir="$3"
            shift 3
            rm -rf "$backup_dir"
            mkdir -p "$backup_dir"
            # Snapshot every file this season owns: the ingest scripts may write
            # the season file, a sibling videos file, or both.
            find src/data/club -maxdepth 1 -name "${season}*" -exec cp {} "$backup_dir/" \; 2>/dev/null || true
            if "$@"; then
              if ! (npm run validate:data && npx tsc -b); then
                echo "::warning::$label validation failed; discarding $label changes for this cycle"
                club_restore "$season" "$backup_dir"
              fi
            else
              echo "::warning::$label step errored; discarding $label changes for this cycle"
              club_restore "$season" "$backup_dir"
            fi
            return 0
          }

          # Budget the run against `timeout-minutes: 58` (3480s); setup costs ~15s.
          # The old loop tested the deadline *before* sleeping, so it could start
          # one more cycle at deadline+300s and overrun — that is what cancelled
          # run 34300459923 at 58m04s, and adding three club competitions to each
          # cycle would make that the normal outcome. So now:
          #   - sleep only the remainder of the period, keeping a true 5-min cadence
          #     even as the cycle body grows
          #   - refuse to start a cycle that the slowest cycle so far says will not
          #     finish inside the budget
          # Ending early costs nothing: Cloudflare dispatches the next run within
          # 5 minutes of this one finishing, so coverage stays continuous.
          LOOP_BUDGET_SECONDS=3000
          CYCLE_PERIOD_SECONDS=300
          loop_start=$(date +%s)
          deadline=$(( loop_start + LOOP_BUDGET_SECONDS ))
          longest_cycle=0
          cycle=0
          while : ; do
            cycle=$((cycle + 1))
            cycle_start=$(date +%s)
            echo "::group::cycle $cycle — $(date -u '+%H:%M:%SZ')"
            rm -f "$CURATOR_ERROR_FLAG"
            rm -f "$RESULTS_AUDIT_FILE"
            # Core updater path.
            cp src/data/wc2026.ts "$RESULTS_BACKUP_FILE"
            if npx tsx scripts/update-results.ts; then
              if [ -f "$RESULTS_AUDIT_FILE" ]; then
                {
                  echo "### Results audit — cycle $cycle"
                  cat "$RESULTS_AUDIT_FILE"
                  echo
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if ! (npm run validate:data && npx tsc -b); then
                echo "::warning::results validation failed; discarding results changes for this cycle"
                cp "$RESULTS_BACKUP_FILE" src/data/wc2026.ts
              fi
            else
              echo "::warning::results step errored; discarding results changes for this cycle"
              cp "$RESULTS_BACKUP_FILE" src/data/wc2026.ts
            fi

            rm -f "$LIVE_STATUS_AUDIT_FILE"
            cp src/data/wc2026.ts "$LIVE_STATUS_BACKUP_FILE"
            if npx tsx scripts/update-live-status.ts; then
              if [ -f "$LIVE_STATUS_AUDIT_FILE" ]; then
                {
                  echo "### Live status audit — cycle $cycle"
                  cat "$LIVE_STATUS_AUDIT_FILE"
                  echo
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if ! (npm run validate:data && npx tsx scripts/update-live-status.smoke.ts && npx tsc -b); then
                echo "::warning::live-status validation failed; discarding live-status changes for this cycle"
                cp "$LIVE_STATUS_BACKUP_FILE" src/data/wc2026.ts
              fi
            else
              echo "::warning::live-status step errored; discarding live-status changes for this cycle"
              cp "$LIVE_STATUS_BACKUP_FILE" src/data/wc2026.ts
            fi

            cp src/data/wc2026.ts "$ODDS_BACKUP_FILE"
            if npx tsx scripts/fetch-odds.ts; then
              if ! (npm run validate:data && npx tsc -b); then
                echo "::warning::odds validation failed; discarding odds changes for this cycle"
                cp "$ODDS_BACKUP_FILE" src/data/wc2026.ts
              fi
            else
              echo "::warning::odds step errored; discarding odds changes for this cycle"
              cp "$ODDS_BACKUP_FILE" src/data/wc2026.ts
            fi

            cp src/data/wc2026.ts "$BACKFILL_BACKUP_FILE"
            if npx tsx scripts/backfill-odds-history.ts; then
              if ! (npm run validate:data && npx tsc -b); then
                echo "::warning::odds backfill validation failed; discarding historical odds changes for this cycle"
                cp "$BACKFILL_BACKUP_FILE" src/data/wc2026.ts
              fi
            else
              echo "::warning::odds backfill step errored; discarding historical odds changes for this cycle"
              cp "$BACKFILL_BACKUP_FILE" src/data/wc2026.ts
            fi

            if [ "$cycle" -eq 1 ]; then
              rm -rf "$VIDEOS_BACKUP_DIR"
              mkdir -p "$VIDEOS_BACKUP_DIR"
              cp src/data/wc2026-videos.ts "$VIDEOS_BACKUP_DIR/wc2026-videos.ts"
              cp scripts/curate-skip.json "$VIDEOS_BACKUP_DIR/curate-skip.json"
              if CURATOR_CYCLE="$cycle" npx tsx scripts/curate-videos.ts; then
                if ! (npm run validate:data && npx tsx src/data/videos.smoke.ts && npx tsc -b); then
                  echo "::warning::video validation failed; discarding video changes for this cycle"
                  cp "$VIDEOS_BACKUP_DIR/wc2026-videos.ts" src/data/wc2026-videos.ts
                  cp "$VIDEOS_BACKUP_DIR/curate-skip.json" scripts/curate-skip.json
                fi
              else
                echo "::warning::video curator step errored; discarding video changes for this cycle"
                cp "$VIDEOS_BACKUP_DIR/wc2026-videos.ts" src/data/wc2026-videos.ts
                cp "$VIDEOS_BACKUP_DIR/curate-skip.json" scripts/curate-skip.json
              fi
            else
              echo "skipping World Cup broad highlight scan; fast ingestion handles new uploads"
            fi

            core_ok=false
            if npm run build:hot-state && npm run build:highlight-state && npm run check:update; then
              core_ok=true
            fi

            if [ "$core_ok" = true ]; then
              git add src/data/wc2026.ts src/data/wc2026-videos.ts public/api/hot-state/wc2026.json public/api/highlights/wc2026.json scripts/curate-skip.json
              if git diff --cached --quiet; then
                echo "no core changes this cycle"
              else
                git commit -m "Auto-update: World Cup 2026 data ($(date -u '+%F %H:%MZ'))"
                git pull --rebase --autostash origin main || true
                if git push origin HEAD:main; then
                  :
                else
                  echo "::warning::push to main failed; will retry next cycle"
                fi
                git push origin HEAD:dev  || echo "dev has diverged; skipping"
              fi
            else
              echo "::error::validation failed — not committing this cycle"
              touch "$CURATOR_ERROR_FLAG"
            fi

            # --- Club competitions ------------------------------------------
            # Results ingest + highlight curation only: no odds.
            #
            # This runs AFTER the World Cup has committed, on purpose.
            # `validate:data` validates every registered tournament, so a club
            # season that goes bad would otherwise fail the World Cup's own
            # commit gate. Running last means the tree the World Cup is gated on
            # only ever contains club files that already passed this same gate.
            rm -f "$CLUB_AUDIT_FILE"
            for entry in $CLUB_COMPETITIONS; do
              season="${entry%%:*}"
              rest="${entry#*:}"
              competition="${rest%%:*}"
              league_slug="${rest#*:}"
              export CLUB_SEASON="$season"
              export CLUB_COMPETITION="$competition"
              export CLUB_LEAGUE_SLUG="$league_slug"

              # --competition, not a positional: both scripts scan every
              # competition they are not narrowed to, so without it each one ran
              # three times per cycle — and the curator's uploads scan is the
              # expensive half of that.
              club_step "$season results" "$season" "$CLUB_BACKUP_ROOT/$season-results" \
                npx tsx scripts/espn-club.ts --competition "$competition"
              if [ "$cycle" -eq 1 ]; then
                club_step "$season videos" "$season" "$CLUB_BACKUP_ROOT/$season-videos" \
                  npx tsx scripts/curate-club-videos.ts --competition "$competition"
              fi
            done
            unset CLUB_SEASON CLUB_COMPETITION CLUB_LEAGUE_SLUG

            if [ -f "$CLUB_AUDIT_FILE" ]; then
              {
                echo "### Club audit — cycle $cycle"
                cat "$CLUB_AUDIT_FILE"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            if npm run build:hot-state && npm run build:highlight-state && npm run check:update; then
              add_if_present src/data/club \
                public/api/hot-state/eng1-2026.json \
                public/api/hot-state/esp1-2026.json \
                public/api/hot-state/ucl-2026.json \
                public/api/highlights/eng1-2026.json \
                public/api/highlights/esp1-2026.json \
                public/api/highlights/ucl-2026.json
              if git diff --cached --quiet; then
                echo "no club changes this cycle"
              else
                git commit -m "Auto-update: club football data ($(date -u '+%F %H:%MZ'))"
                git pull --rebase --autostash origin main || true
                if git push origin HEAD:main; then
                  git push origin HEAD:dev || echo "dev has diverged; skipping"
                else
                  # Warn and retry next cycle, exactly like the World Cup push
                  # above. Deliberately NOT `reset --hard origin/main`: if the
                  # World Cup's own push failed earlier this cycle, its commit is
                  # sitting unpushed on HEAD and resetting would discard it.
                  echo "::warning::club push to main failed; will retry next cycle"
                fi
              fi
            else
              # A warning, not CURATOR_ERROR_FLAG: club is best-effort and must
              # never turn a healthy World Cup run red. The World Cup has already
              # committed by this point either way.
              echo "::warning::club validation failed; not committing club data this cycle"
              {
                echo "### Club audit — cycle $cycle"
                echo "- reason: club_validation_failed"
                echo "- action: skipped the club commit for this cycle"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"

            cycle_end=$(date +%s)
            cycle_seconds=$(( cycle_end - cycle_start ))
            if [ "$cycle_seconds" -gt "$longest_cycle" ]; then longest_cycle=$cycle_seconds; fi
            sleep_seconds=$(( CYCLE_PERIOD_SECONDS - cycle_seconds ))
            if [ "$sleep_seconds" -lt 0 ]; then sleep_seconds=0; fi
            echo "cycle $cycle took ${cycle_seconds}s (slowest ${longest_cycle}s); sleeping ${sleep_seconds}s"
            if [ $(( cycle_end + sleep_seconds + longest_cycle )) -ge "$deadline" ]; then
              echo "stopping after cycle $cycle — another cycle would not fit the run budget"
              break
            fi
            sleep "$sleep_seconds"
          done
          # Fail the run (so GitHub emails you) only if the LAST cycle had a real
          # problem — bad data or a persistent curator error (e.g. a dead key).
          if [ -f "$CURATOR_ERROR_FLAG" ]; then
            echo "::error::Last cycle reported errors — check the run summary."
            exit 1
          fi
